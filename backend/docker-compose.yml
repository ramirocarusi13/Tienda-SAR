services:
  api1:
    image: sar-tienda-api:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: tienda-api1
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${TIENDA_API1_PORT:-4557}:80"
    restart: unless-stopped
  api2:
    image: sar-tienda-api:latest
    container_name: tienda-api2
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - api1
    ports:
      - "${TIENDA_API2_PORT:-4558}:80"
    restart: unless-stopped
  # api3:
  #   image: sar-tienda-api:latest
  #   build:
  #     context: .
  #     dockerfile: dockerfile
  #   ports:
  #     - "${TIENDA_API3_PORT:-4559}:80"
  #   restart: unless-stopped
    
  nginx:
    image: sar-tienda-api-nginx:latest
    build: ./nginx
    container_name: tienda-api-nginx
    depends_on:
      - api1
      - api2
    ports:
      - "${TIENDA_API_PORT:-4555}:80"
    restart: unless-stopped
